# Gitleaks' default rules, plus one narrow allowlist on one rule.
[extend]
useDefault = true

# wgc keys each schema in an execution config's stringStorage by its SHA-1, which generic-api-key
# reads as a secret. Only a 40-character hex value is allowed, only for this rule, and only in the
# two generated files: the real graph's config, and the test-only graph the sandbox router's tests
# use. The owner approved each path, on 2026-11-09 and 2026-11-16. A global allowlist in the pinned gitleaks (8.24.3) ignores `condition`, so it would
# allow anything in the file.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Schema hashes in the generated router configs"
condition = "AND"
paths = ['''(^|/)router/config\.json$''', '''(^|/)router/test/fixtures/sandbox-graph/config\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{40}$''']
