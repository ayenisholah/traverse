name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Module boundaries
        run: npm run check:deps
      - name: Duplicated code
        run: npm run check:dupes
      - name: Unused code
        run: npm run check:unused
      - name: Hygiene
        run: npm run check:hygiene
      - name: Requirement traceability
        run: npm run check:traceability
      - name: Progress log
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'github-actions[bot]'
        run: npm run check:progress -- "${{ github.event.pull_request.base.sha }}"
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      - name: Static export of the web app
        run: npm run build:web
      - name: Integration tests
        run: npm run test:integration
      - name: Router end-to-end tests, on the pinned router image
        run: npm run test:router
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Demo tests, from the path GitHub Pages uses
        run: npm run test:demo
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan full history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact
